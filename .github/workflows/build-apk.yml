name: Build APK

on:
  push:
    branches: [main]
    # Text and picture changes don't need a new app build.
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# A newer push cancels an older build still running, so changes uploaded
# file by file never send "failed" emails for the half-done steps.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Only used to decide whether to send the bundle to Play.
      PLAY_SA: ${{ secrets.GOOGLE_PLAY_SA }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set).
      - uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Same debug signing key on every build, so updates install over the old app.
      - name: Use fixed debug signing key
        run: |
          mkdir -p ~/.android
          # The key lives in the repo's secrets, never in the code.
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then echo "Secret SIGNING_KEYSTORE_B64 is missing"; exit 1; fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > androidApp/debug.keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}

      - name: Run tests
        run: ./gradlew :shared:testDebugUnitTest --stacktrace

      # The Play version is signed with the Play upload key when it is set up.
      # Without it, the bundle is signed with the GitHub key and can only be used for testing.
      - name: Use Play upload key
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$PLAY_UPLOAD_KEYSTORE_B64" ]; then
            echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 -d > androidApp/upload.keystore
          else
            echo "::warning::PLAY_UPLOAD_KEYSTORE_B64 is not set. The Play bundle is not upload-ready."
          fi

      - name: Build GitHub APK and Play bundle
        env:
          PLAY_UPLOAD_PASSWORD: ${{ secrets.PLAY_UPLOAD_PASSWORD }}
        run: ./gradlew :androidApp:assembleGithubRelease :androidApp:bundlePlayRelease --stacktrace

      # The Play version must not be able to install apps or update itself.
      - name: Check the Play version has no install permission
        run: |
          M=androidApp/build/intermediates/merged_manifests/playRelease/processPlayReleaseManifest/AndroidManifest.xml
          [ -f "$M" ] || M=$(find androidApp/build/intermediates -path '*playRelease*' -name AndroidManifest.xml | head -1)
          echo "Checking $M"
          if grep -q REQUEST_INSTALL_PACKAGES "$M"; then echo "Play manifest has REQUEST_INSTALL_PACKAGES"; exit 1; fi
          if grep -q REQUEST_INSTALL_PACKAGES <(find androidApp/build/intermediates -path '*githubRelease*' -name AndroidManifest.xml -exec cat {} +); then echo "GitHub version keeps its updater: ok"; fi

      - name: Collect the APK and bundle
        run: |
          mkdir -p /tmp/out
          cp androidApp/build/outputs/apk/github/release/*.apk /tmp/out/FileAgent.apk
          cp androidApp/build/outputs/bundle/playRelease/*.aab /tmp/out/FileAgent-play.aab
          ls -l /tmp/out

      - uses: actions/upload-artifact@v5
        with:
          name: FileAgent-apk
          path: /tmp/out/FileAgent.apk

      # Download this from the run page and upload it in Play Console (the first upload is by hand).
      - uses: actions/upload-artifact@v5
        with:
          name: FileAgent-play-aab
          path: /tmp/out/FileAgent-play.aab

      # Every build becomes a GitHub release with the APK attached.
      - name: Publish GitHub release
        # Only main becomes an update for users. Other branches just check that the app builds.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" /tmp/out/FileAgent.apk \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "File Agent build ${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):')" \
            --latest

      # After the first manual upload, each main build goes to the closed test by itself,
      # so testers always get the newest version. Needs the PLAY_SERVICE_ACCOUNT secret.
      - name: Send to Play closed test
        if: github.ref == 'refs/heads/main' && env.PLAY_SA != ''
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SA }}
          packageName: dev.fileagent.app
          releaseFiles: /tmp/out/FileAgent-play.aab
          track: alpha
          status: completed
