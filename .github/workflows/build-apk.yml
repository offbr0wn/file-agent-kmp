name: Build APK

on:
  push:
    branches: [main]
    # Text and picture changes don't need a new app build.
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# A newer push cancels an older build still running, so changes uploaded
# file by file never send "failed" emails for the half-done steps.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set).
      - uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Same debug signing key on every build, so updates install over the old app.
      - name: Use fixed debug signing key
        run: |
          mkdir -p ~/.android
          # The key lives in the repo's secrets, never in the code.
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then echo "Secret SIGNING_KEYSTORE_B64 is missing"; exit 1; fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > androidApp/debug.keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}

      - name: Run tests
        run: ./gradlew :shared:testDebugUnitTest --stacktrace

      - name: Build APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: FileAgent-apk
          path: androidApp/build/outputs/apk/release/*.apk

      - name: Collect the APK
        run: |
          mkdir -p /tmp/out
          cp androidApp/build/outputs/apk/release/*.apk /tmp/out/FileAgent.apk
          ls -l /tmp/out

      # Every build becomes a GitHub release with the APK attached.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" /tmp/out/FileAgent.apk \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "File Agent build ${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):')" \
            --latest
