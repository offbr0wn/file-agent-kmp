name = "file-agent"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "file-agent"
database_id = "REPLACED_BY_CI"
migrations_dir = "migrations"

[vars]
# Public Stripe payment links. The app adds ?client_reference_id=<account> so a payment
# lands on the right account.
PLAN_LINK = ""
PACK_LINK = ""
PLAN_MESSAGES = "1000"
PACK_MESSAGES = "500"
# Cheap, sees pictures, can use tools. Change it here to switch the paid AI for everyone.
MODEL = "deepseek/deepseek-v4.1-flash"
# Guard rails: per message, per minute, and a monthly AI-fee ceiling per person (USD).
MAX_STEPS = "15"
PER_MINUTE = "10"
COST_CAP_USD = "5"
# Google Play: the app's package and the product IDs set up in Play Console.
PACKAGE = "dev.fileagent.app"
PLAY_PLUS_ID = "plus_monthly"
PLAY_TOPUP_ID = "topup_500"
